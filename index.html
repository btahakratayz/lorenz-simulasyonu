<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaos Teoremi ve Hava Tahmini - Etkileşimli Lorenz Simülasyonu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #000010 0%, #000 100%);
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 20px 0;
    }
    h1 {
      margin: 0;
      font-size: 2em;
      color: #00a8ff;
      text-shadow: 0 0 20px #00a8ff;
    }
    p {
      margin: 0;
      color: #f5f6fa;
      font-size: 1.1em;
    }
    canvas {
      border: none;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
      background: transparent;
    }
    footer {
      position: absolute;
      bottom: 10px;
      text-align: center;
      color: #718093;
      font-size: 0.9em;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #44bd32;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px #4cd137;
    }
    button:hover { background-color: #4cd137; }
  </style>
</head>

<body>
  <header>
    <h1>Kaos Teoremi ve Hava Tahmini</h1>
    <p>Etkileşimli Lorenz Simülasyonu (Ses Tepkili)</p>
    <button onclick="startSimulation()">Simülasyonu Başlat</button>
  </header>

  <canvas id="lorenzCanvas" width="900" height="600"></canvas>

  <footer>
    Hazırlayan: <strong>Taha Karatay</strong> | Danışman: <strong>Doç. Dr. Yasemin Soylu</strong>
  </footer>

  <script>
    const canvas = document.getElementById("lorenzCanvas");
    const ctx = canvas.getContext("2d");

    let points = [];
    let animating = false;
    let micLevel = 0; // ses seviyesi

    async function startSimulation() {
      if (!animating) {
        await initMic(); // mikrofon izni iste
        generateLorenz();
        animate();
      }
    }

    function generateLorenz() {
      const sigma = 10;
      const rho = 28;
      const beta = 2.6667;
      let x = 0.1, y = 0, z = 0;
      const dt = 0.01;
      points = [];

      for (let i = 0; i < 20000; i++) {
        const dx = sigma * (y - x);
        const dy = x * (rho - z) - y;
        const dz = x * y - beta * z;
        x += dx * dt;
        y += dy * dt;
        z += dz * dt;
        points.push({x, y, z});
      }
    }

    async function initMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateMicLevel() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          micLevel = sum / dataArray.length / 256; // normalize
          requestAnimationFrame(updateMicLevel);
        }
        updateMicLevel();
      } catch (err) {
        console.log("Mikrofon erişimi reddedildi:", err);
      }
    }

    function animate() {
      animating = true;
      let t = 0;
      let angle = 0;
      const scale = 10;
      const speed = 3;

      function frame() {
        // hafif iz efekti
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        for (let i = 0; i < 1000; i++) {
          const p = points[(t + i) % points.length];

          // 3B dönüş efekti
          const cosA = Math.cos(angle);
          const sinA = Math.sin(angle);
          const x3d = p.x * cosA - p.z * sinA;
          const z3d = p.x * sinA + p.z * cosA;

          const px = canvas.width / 2 + x3d * scale;
          const py = canvas.height / 2 - p.y * scale;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }

        // renk ve efektler
        const hue = (t / 2) % 360;
        const brightness = 60 + micLevel * 30; // ses tepkili parlaklık
        ctx.strokeStyle = `hsl(${hue}, 100%, ${brightness}%)`;
        ctx.lineWidth = 2.5 + micLevel * 2;
        ctx.shadowBlur = 15 + micLevel * 25;
        ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
        ctx.stroke();

        // hareket ve dönüş
        t = (t + speed) % points.length;
        angle += 0.002 + micLevel * 0.003;
        requestAnimationFrame(frame);
      }

      frame();
    }
  </script>
</body>
</html>
